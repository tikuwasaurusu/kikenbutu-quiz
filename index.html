<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e8590c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>危険物取扱者</title>
    <link rel="icon" href="icon-192.png">
    <style>
        :root {
            --bg: #f7f5f0;
            --card: white;
            --text: #333;
            --sub: #888;
            --accent: #e8590c;
            --hover: #fff0e6;
            --note: #fff9db;
            --gray: #eee;
            --line: #ccc;
        }

        body.dark {
            --bg: #1e1e1e;
            --card: #2b2b2b;
            --text: #e8e8e8;
            --sub: #aaa;
            --accent: #ff7a2e;
            --hover: #3d2a1f;
            --note: #3a3520;
            --gray: #3a3a3a;
            --line: #555;
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
        }

        h1 {
            background-color: var(--accent);
            color: white;
            text-align: center;
            font-size: 22px;
            padding: 12px;
            border-radius: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 16px;
            background-color: var(--card);
            border: 2px solid var(--accent);
            border-radius: 10px;
            cursor: pointer;
            color: var(--text);
        }

        button:hover {
            background-color: var(--hover);
        }

        #question {
            background-color: var(--card);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            line-height: 1.6;
        }

        #score {
            text-align: right;
            color: var(--sub);
        }

        #result {
            font-weight: bold;
            font-size: 18px;
        }

        #explanation {
            background-color: var(--note);
            border-left: 4px solid #f59f00;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.6;
        }

        #explanation:empty {
            display: none;
        }

        #controls {
            margin-top: 80px;
        }

        #controls button {
            background-color: var(--gray);
            font-size: 14px;
        }

        .review {
            background-color: var(--card);
            border-left: 4px solid #e03131;
            padding: 8px 12px;
            margin: 12px 0;
            border-radius: 6px;
            line-height: 1.6;
        }

        details {
            background-color: var(--card);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
        }

        #exam-button,
        #exam-start {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-top: 24px;
        }

        #exam-button:hover,
        #exam-start:hover {
            background-color: #d9480f;
        }

        .exam-info {
            background-color: var(--card);
            border-radius: 10px;
            padding: 12px 16px;
            line-height: 1.6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        #add-screen label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        #add-screen input,
        #add-screen textarea,
        #add-screen select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 4px;
            border: 2px solid var(--line);
            background-color: var(--card);
            color: var(--text);
        }

        #my-list-items button {
            display: inline-block;
            width: auto;
            padding: 6px 16px;
            margin: 4px 8px 4px 0;
            font-size: 14px;
        }

        #otsu-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        #otsu-buttons button {
            margin: 0;
        }

        #question,
        .review p {
            white-space: pre-wrap;
        }

        #set-size {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: var(--card);
            color: var(--text);
        }

        #progress {
            text-align: right;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 0;
        }

        #set-end-score {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        #set-end-progress {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
        }

        #reset-button {
            background-color: var(--gray);
            border-color: var(--line);
            font-size: 14px;
            margin-top: 24px;
        }

        #bookmark-button {
            display: block;
            width: auto;
            margin: 0 0 0 auto;
            padding: 6px 14px;
            font-size: 14px;
        }

        #bookmark-button.on {
            background-color: var(--accent);
            color: white;
        }

        /* メニューのグループ(白いカード) */
        .menu-section {
            background-color: var(--card);
            border-radius: 12px;
            padding: 4px 16px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .menu-title {
            font-size: 16px;
            color: var(--accent);
            margin: 12px 0 8px;
        }

        /* 2列に並べる */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .grid-2 button {
            margin: 0;
        }

        /* グループの中の模擬試験ボタンは、上の余白をなくす */
        .menu-section #exam-button {
            margin-top: 0;
        }

        /* 検索欄とボタンを横に並べる */
        #search-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        #search-box input {
            flex: 1;
        }

        #search-box button {
            width: auto;
            margin: 0;
            padding: 0 18px;
        }

        /* 一番下の小さいボタン */
        .menu-footer button {
            background-color: var(--gray);
            border-color: var(--line);
            font-size: 14px;
            padding: 10px;
        }
        .menu-footer {
            grid-template-columns: repeat(3, 1fr);
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-card {
            background-color: var(--card);
            border-radius: 10px;
            padding: 12px 4px;
            text-align: center;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-num {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
        }

        .bar-label {
            font-size: 14px;
            margin-top: 10px;
        }
        .bar {
            background-color: var(--gray);
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
        }
        .bar-fill {
            background-color: var(--accent);
            height: 100%;
        }
        .bar-fill.pass {
            background-color: #2f9e44;
        }

        .history-item {
            background-color: var(--card);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 6px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>危険物一問一答</h1>


    <div id="modes">

        <section class="menu-section">
            <h2 class="menu-title">📖 練習</h2>
            <label for="set-size">1回の出題数</label>
            <select id="set-size" onchange="localStorage.setItem('setSize', this.value)">
                <option value="all">全問</option>
                <option value="5">5問ずつ</option>
                <option value="10">10問ずつ</option>
            </select>
            <div class="grid-2">
                <button onclick="startMode('all')">全科目</button>
                <button onclick="startMode('法令')">法令</button>
                <button onclick="startMode('物化')">物化</button>
                <button onclick="showRuiSelect()">性消</button>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">📝 本番形式</h2>
            <button id="exam-button" onclick="showExamIntro()">模擬試験(甲種・乙種)</button>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">🔁 復習</h2>
            <button onclick="startBookmarks()">★ ブックマークした問題</button>
            <div id="search-box">
                <input id="search-word" placeholder="キーワード(例:ナトリウム)"
                    onkeydown="if (event.key === 'Enter') startSearch()">
                <button onclick="startSearch()">🔍</button>
            </div>
        </section>

        <div class="grid-2 menu-footer">
            <button onclick="showStats()">📊 学習記録</button>
            <button onclick="showAddScreen()">✏️ 自作問題</button>
            <button onclick="showScreen('settings')">⚙️ 設定</button>
        </div>

    </div>

    <div id="stats">
        <h2>学習記録</h2>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-num" id="stat-today">0</div>
                <div>今日解いた問題</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-streak">0</div>
                <div>連続学習日数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-total">0</div>
                <div>総回答数</div>
            </div>
        </div>

        <h3>科目別の正答率</h3>
        <div id="stat-subjects"></div>

        <h3>模擬試験の履歴</h3>
        <div id="stat-history"></div>

        <button onclick="backToMenu()">戻る</button>
    </div>
    <div id="settings">
        <h2>設定</h2>

        <h3>表示</h3>
        <button id="dark-button" onclick="toggleDark()">🌙 ダークモード</button>

        <h3>データ</h3>
        <button id="reset-button" onclick="resetDecks()">🔄 〇問ずつの進み具合をリセット</button>

        <button onclick="backToMenu()">戻る</button>
    </div>
    <div id="my-list">
        <h2>自作の問題一覧</h2>
        <button onclick="showAddScreen()">新しく追加</button>
        <div id="my-list-items"></div>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="add-screen">
        <h2 id="add-title">問題追加</h2>
        <button onclick="showMyList()">自作問題一覧を見る</button>

        <label>科目</label>
        <select id="add-subject">
            <option value="法令">法令</option>
            <option value="物化">物化</option>
            <option value="性消">性消</option>
        </select>

        <label>類（性消）</label>
        <select id="add-rui">
            <option value="1">第1類</option>
            <option value="2">第2類</option>
            <option value="3">第3類</option>
            <option value="4">第4類</option>
            <option value="5">第5類</option>
            <option value="6">第6類</option>
        </select>

        <label>問題文</label>
        <textarea id="add-question" rows="4" cols="50"></textarea>

        <label>選択肢</label>
        <input type="text" id="add-choice0" placeholder="選択肢1">
        <input type="text" id="add-choice1" placeholder="選択肢2">
        <input type="text" id="add-choice2" placeholder="選択肢3">
        <input type="text" id="add-choice3" placeholder="選択肢4">
        <input type="text" id="add-choice4" placeholder="選択肢5">

        <label>正解</label>
        <select id="add-answer">
            <option value="0">選択肢1</option>
            <option value="1">選択肢2</option>
            <option value="2">選択肢3</option>
            <option value="3">選択肢4</option>
            <option value="4">選択肢5</option>
        </select>

        <label>解説</label>
        <textarea id="add-explanation" rows="4" cols="50"></textarea>

        <p id="add-message"></p>
        <button onclick="saveMyQuiz()">保存する</button>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="rui-select">
        <h2>性消：類を選択する</h2>
        <button onclick="startMode(`性消`)">全類</button>
        <button onclick="startRui(1)">第１類</button>
        <button onclick="startRui(2)">第２類</button>
        <button onclick="startRui(3)">第３類</button>
        <button onclick="startRui(4)">第4類</button>
        <button onclick="startRui(5)">第5類</button>
        <button onclick="startRui(6)">第6類</button>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="exam-intro">
        <h2>模擬試験</h2>
        <div class="exam-info">
            <p><b>本試験と同じ構成で出題します（ただし順不同）</b></p>
            <p><b>甲種</b>:法令15問・物化10問・性消20問</p>
            <p><b>乙種</b>:法令15問・物化10問・性消10問</p>
            <p><b>合格基準</b>各科目それぞれ60%以上の正答</p>
            <p>(本試験の試験時間は甲種2時間半乙種2時間)</p>
            <p>途中でモード選択に戻ると結果は記録されません</p>
        </div>
        <div id="last-result"></div>

        <button id="exam-start" onclick="startMode(`exam`)">甲種試験開始</button>
        <h3>乙種(類を選んで開始)</h3>
        <div id="otsu-buttons">
            <button onclick="startOtsuExam(1)">第１類</button>
            <button onclick="startOtsuExam(2)">第2類</button>
            <button onclick="startOtsuExam(3)">第3類</button>
            <button onclick="startOtsuExam(4)">第4類</button>
            <button onclick="startOtsuExam(5)">第5類</button>
            <button onclick="startOtsuExam(6)">第6類</button>
        </div>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="quiz-screen">
        <p id="progress"></p>
        <p id="score"></p>
        <button id="bookmark-button" onclick="toggleBookmark()">☆ ブックマーク</button>
        <p id="question"></p>
        <div id="choices"></div>
        <p id="result"></p>
        <p id="explanation"></p>
        <div id="controls">
            <button onclick="next()">次の問題</button>
            <button onclick="backToMenu()">モード選択</button>
        </div>
    </div>
    <div id="set-end">
        <h2>セット終了</h2>
        <p id="set-end-score"></p>
        <p id="set-end-progress"></p>
        <div id="set-end-wrongs"></div>
        <button id="set-continue" onclick="continueSet()">続ける</button>
        <button onclick="backToMenu()">モード選択に戻る</button>
    </div>

    <script src="questions.js"></script>
    <script>
       
        let quizzes = allQuizzes;
        let myQuizzes = [];
        const savedMine = localStorage.getItem("myQuizzes");
        if (savedMine) {
            myQuizzes = JSON.parse(savedMine);
        }
        for (let i = 0; i < myQuizzes.length; i++) {
            allQuizzes.push(myQuizzes[i]);
        }
        //今何問目か
        let current = 0;
        let score = 0;
        let answered = false;
        let isExam = false;
        let correctBySubject = {}
        let wrongQuizzes = [];
        let examKey = "lastExam";
        let examTitle = "甲種"
        let setInfo = null;
        let progressText = "";
        let remainingCount = 0;
        let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
        let stats = JSON.parse(localStorage.getItem("stats") || "null") || { days: {}, subjects: {} };
        
        //問題を画面に表示する
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }
        function pickRandom(subject, count) {
            const list = allQuizzes.filter(function (quiz) {
                return quiz.subject === subject;
            });
            shuffle(list);
            return list.slice(0, count);
        }
        function pickRandomRui(rui, count) {
            const list = allQuizzes.filter(function (quiz) {
                return quiz.subject === "性消" && quiz.rui === rui;
            });
            shuffle(list);
            return list.slice(0, count);
        }

        function getSetSize() {
            const value = document.getElementById("set-size").value;
            if (value === "all") {
                return 0;
            }
            return Number(value);
        }

        function getPool(info) {
            if (info.mode === "all") {
                return allQuizzes;
            }
            return allQuizzes.filter(function (quiz) {
                if (info.rui) {
                    return quiz.subject === "性消" && quiz.rui === info.rui;
                }
                return quiz.subject === info.mode;
            });
        }

        function takeFromDeck(info, size) {
            const pool = getPool(info);
            const deckKey = "deck-" + info.key;
            const roundKey = "round-" + info.key;

            let deck = JSON.parse(localStorage.getItem(deckKey) || "[]");
            let round = Number(localStorage.getItem(roundKey) || "1");

            deck = deck.filter(function (text) {
                return pool.some(function (q) {
                    return q.question === text;
                });
            });

            if (deck.length === 0) {
                if (localStorage.getItem(deckKey) !== null) {
                    round++;
                }
                deck = pool.map(function (q) {
                    return q.question;
                });
                shuffle(deck);
            }

            const taken = deck.slice(0, size);
            const rest = deck.slice(size);
            localStorage.setItem(deckKey, JSON.stringify(rest));
            localStorage.setItem(roundKey, String(round));

            remainingCount = rest.length;
            progressText = round + "周目あと" + rest.length + "問(全" + pool.length + "問)";

            return taken.map(function (text) {
                return pool.find(function (q) {
                    return q.question === text;
                });
            });
        }

        function startSet(info, size) {
            setInfo = info;
            quizzes = takeFromDeck(info, size);
            if (quizzes.length === 0) {
                alert("この範囲には問題がありません");
                backToMenu();
                return;
            }
            isExam = false;
            beginQuiz();
        }
        function toggleDark() {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            localStorage.setItem("dark", isDark ? "1" : "0");
            updateDarkButton();
        }

        function updateDarkButton() {
            const isDark = document.body.classList.contains("dark");
            document.getElementById("dark-button").textContent =
                isDark ? "☀️ ライトモード" : "🌙 ダークモード";
        }

        function resetDecks() {
            if (!confirm("〇問ずつモードの進み具合を、すべての範囲でリセットしますか？")) {
                return;
            }

            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                keys.push(localStorage.key(i));
            }

            for (let i = 0; i < keys.length; i++) {
                if (keys[i].startsWith("deck-") || keys[i].startsWith("round-")) {
                    localStorage.removeItem(keys[i]);
                }
            }

            alert("リセットしました");
        }

        function showSetEnd() {
            showScreen("set-end");

            document.getElementById("set-end-score").textContent =
                "正解数" + score + "/" + quizzes.length;

            const progress = document.getElementById("set-end-progress");
            if (remainingCount === 0) {
                progress.textContent = "🎉 1周終わりました！次は新しい周が始まります";
            } else {
                progress.textContent = progressText;
            }

            const continueButton = document.getElementById("set-continue");
            continueButton.textContent = "続ける(次の" + getSetSize() + "問)";

            const box = document.getElementById("set-end-wrongs");
            box.innerHTML = "";
            if (wrongQuizzes.length === 0) {
                box.textContent = "全問正解です";
                return;
            }
            for (let i = 0; i < wrongQuizzes.length; i++) {
                const q = wrongQuizzes[i];
                const item = document.createElement("div");
                item.className = "review";

                const question = document.createElement("p");
                question.textContent = q.question;
                const answer = document.createElement("p");
                answer.textContent = "正解:" + q.choices[q.answer];
                const explanation = document.createElement("p");
                explanation.textContent = q.explanation;

                item.appendChild(question);
                item.appendChild(answer);
                item.appendChild(explanation);
                box.appendChild(item);
            }
        }

        function continueSet() {
            startSet(setInfo, getSetSize());
        }


        function beginQuiz() {
            current = 0;
            score = 0;
            correctBySubject = { "法令": 0, "物化": 0, "性消": 0 };
            wrongQuizzes = [];
            shuffle(quizzes);
            showScreen("quiz-screen");
            document.getElementById("progress").textContent = progressText;
            updateScore();
            showQuiz();
        }

        function startOtsuExam(rui) {
            setInfo = null;
            progressText = "";
            quizzes = pickRandom("法令", 15).concat(
                pickRandom("物化", 10),
                pickRandomRui(rui, 10)
            );
            isExam = true;
            examKey = "lastExam-otsu" + rui;
            examTitle = "乙種 第" + rui + "類";
            beginQuiz();
        }
        function startMode(mode) {
            setInfo = null;
            progressText = "";
            const size = getSetSize();
            if (size > 0 && mode !== "exam") {
                startSet({ key: mode, mode: mode }, size);
                return;
            }
            if (mode === "all") {
                quizzes = allQuizzes;
            } else if (mode === "exam") {
                quizzes = pickRandom("法令", 15).concat(
                    pickRandom("物化", 10),
                    pickRandom("性消", 20)
                );
                examKey = "lastExam";
                examTitle = "甲種";
            } else {
                quizzes = allQuizzes.filter(function (quiz) {
                    return quiz.subject === mode;
                });
            }
            isExam = (mode === "exam");
            beginQuiz();
        }

        function startRui(rui) {
            setInfo = null;
            progressText = "";
            const size = getSetSize();
            if (size > 0) {
                startSet({ key: "rui" + rui, mode: "性消", rui: rui }, size);
                return;
            }
            quizzes = allQuizzes.filter(function (quiz) {
                return quiz.subject === "性消" && quiz.rui === rui;
            });

            isExam = false;
            beginQuiz();
        }

        function showScreen(id) {
            const screens = ["modes", "quiz-screen", "exam-intro", "rui-select", "add-screen", "my-list", "set-end", "settings", "stats"];
            for (let i = 0; i < screens.length; i++) {
                if (screens[i] === id) {
                    document.getElementById(screens[i]).style.display = "block";
                } else {
                    document.getElementById(screens[i]).style.display = "none";
                }
            }
        }
        let editingIndex = -1;

        function saveMyQuizzesToStorage() {
            localStorage.setItem("myQuizzes", JSON.stringify(myQuizzes));
        }

        function clearAddForm() {
            document.getElementById("add-question").value = "";
            document.getElementById("add-explanation").value = "";
            for (let i = 0; i < 5; i++) {
                document.getElementById("add-choice" + i).value = "";
            }
            document.getElementById("add-answer").value = 0;
        }

        function showAddScreen() {
            editingIndex = -1;
            clearAddForm();
            document.getElementById("add-title").textContent = "問題を追加";
            document.getElementById("add-message").textContent = "";
            showScreen("add-screen");
        }

        function showMyList() {
            showScreen("my-list");
            const box = document.getElementById("my-list-items");
            box.innerHTML = "";

            if (myQuizzes.length === 0) {
                box.textContent = "まだ自作問題はありません";
                return;
            }

            for (let i = 0; i < myQuizzes.length; i++) {
                const q = myQuizzes[i];

                let label = q.subject;
                if (q.rui) {
                    label += "・第" + q.rui + "類";
                }

                const item = document.createElement("div");
                item.className = "review";

                const text = document.createElement("p");
                text.textContent = (i + 1) + ".[" + label + "]"
                    + q.question.replace("【" + q.subject + "】", "");

                const editButton = document.createElement("button");
                editButton.textContent = "編集";
                editButton.onclick = function () {
                    editMyQuiz(i);
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "削除"
                deleteButton.onclick = function () {
                    deleteMyQuiz(i);
                };

                item.appendChild(text);
                item.appendChild(editButton);
                item.appendChild(deleteButton);
                box.appendChild(item);
            }
        }

        function editMyQuiz(i) {
            const q = myQuizzes[i];
            editingIndex = i;

            document.getElementById("add-subject").value = q.subject;
            if (q.rui) {
                document.getElementById("add-rui").value = q.rui;
            }
            document.getElementById("add-question").value =
                q.question.replace("【" + q.subject + "】", "");
            for (let j = 0; j < 5; j++) {
                document.getElementById("add-choice" + j).value = q.choices[j];
            }
            document.getElementById("add-answer").value = q.answer;
            if (q.explanation === "(解説なし)") {
                document.getElementById("add-explanation").value = "";
            } else {
                document.getElementById("add-explanation").value = q.explanation;
            }

            document.getElementById("add-title").textContent = "問題を編集";
            document.getElementById("add-message").textContent = "";
            showScreen("add-screen");
        }

        function deleteMyQuiz(i) {
            if (!confirm("この問題を削除しますか？")) {
                return;
            }
            const q = myQuizzes[i];
            const pos = allQuizzes.indexOf(q);
            if (pos !== -1) {
                allQuizzes.splice(pos, 1);
            }
            myQuizzes.splice(i, 1);
            saveMyQuizzesToStorage();
            showMyList();
        }

        //入力した問題を保存するよん
        function saveMyQuiz() {
            const subject = document.getElementById("add-subject").value;
            const question = document.getElementById("add-question").value.trim();
            const explanation = document.getElementById("add-explanation").value.trim();
            const answer = Number(document.getElementById("add-answer").value);
            const message = document.getElementById("add-message");

            const choices = [];
            for (let i = 0; i < 5; i++) {
                choices.push(document.getElementById("add-choice" + i).value.trim());
            }
            if (choices[4] === "") {
                choices.pop();
            }

            if (question === "" || choices.includes("")) {
                message.textContent = "問題文と選択肢1~4をすべて入力してください";
                message.style.color = "red";
                return;
            }

            if (answer >= choices.length) {
                message.textContent = "正解に選んだ選択肢が入力されていません";
                message.style.color = "red";
                return;
            }

            const quiz = {
                subject: subject,
                question: "【" + subject + "】" + question,
                choices: choices,
                answer: answer,
                explanation: explanation || "(解説なし)",
                mine: true
            };
            if (subject === "性消") {
                quiz.rui = Number(document.getElementById("add-rui").value);
            }

            if (editingIndex >= 0) {
                const old = myQuizzes[editingIndex];
                const pos = allQuizzes.indexOf(old);
                if (pos !== -1) {
                    allQuizzes[pos] = quiz;
                }
                saveMyQuizzesToStorage();
                editingIndex = -1;
                showMyList();
                return;
            }

            allQuizzes.push(quiz);
            myQuizzes.push(quiz);
            saveMyQuizzesToStorage();

            message.textContent = "保存しました(自作問題:" + myQuizzes.length + "問)";
            message.style.color = "green";

            clearAddForm();
        }

        function backToMenu() {
            showScreen("modes");
        }
        // 正解数の表示を更新する
        function updateScore() {
            document.getElementById("score").textContent =
                "正解数:" + score + " / " + quizzes.length;
        }
        function isBookmarked(quiz) {
            return bookmarks.includes(quiz.question);
        }

        function toggleBookmark() {
            const quiz = quizzes[current];
            if (isBookmarked(quiz)) {
                bookmarks = bookmarks.filter(function (text) {
                    return text !== quiz.question;
                });
            } else {
                bookmarks.push(quiz.question);
            }
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
            updateBookmarkButton();
        }

        function updateBookmarkButton() {
            const button = document.getElementById("bookmark-button");
            if (isBookmarked(quizzes[current])) {
                button.textContent = "★ ブックマーク済み";
                button.classList.add("on");
            } else {
                button.textContent = "☆ ブックマーク";
                button.classList.remove("on");
            }
        }

        function startBookmarks() {
            quizzes = allQuizzes.filter(function (quiz) {
                return isBookmarked(quiz);
            });
            if (quizzes.length === 0) {
                alert("まだブックマークした問題はありません");
                return;
            }
            setInfo = null;
            progressText = "";
            isExam = false;
            beginQuiz();
        }

        function startSearch() {
            const word = document.getElementById("search-word").value.trim();
            if (word === "") {
                alert("検索ワードを入力してください");
                return;
            }

            quizzes = allQuizzes.filter(function (quiz) {
                const text = quiz.question + " " + quiz.choices.join(" ") + " " + quiz.explanation;
                return text.includes(word);
            });

            if (quizzes.length === 0) {
                alert("「" + word + "」を含む問題は見つかりませんでした");
                return;
            }

            setInfo = null;
            isExam = false;
            progressText = "「" + word + "」の検索結果:" + quizzes.length + "問";
            beginQuiz();
        }

        function dayKey(offset) {
            const d = new Date();
            d.setDate(d.getDate() - offset);
            return d.toLocaleDateString("ja-JP");
        }

        function showStats() {
            showScreen("stats");

            const subjects = ["法令", "物化", "性消"];
            let total = 0;
            for (let i = 0; i < subjects.length; i++) {
                const s = stats.subjects[subjects[i]];
                if (s) {
                    total += s.answered;
                }
            }
            document.getElementById("stat-today").textContent = stats.days[dayKey(0)] || 0;
            document.getElementById("stat-streak").textContent = getStreak();
            document.getElementById("stat-total").textContent = total;

            const box = document.getElementById("stat-subjects");
            box.innerHTML = "";
            for (let i = 0; i < subjects.length; i++) {
                const s = stats.subjects[subjects[i]] || {answered: 0, correct: 0 };
                let rate = 0;
                if (s.answered > 0) {
                    rate = Math.round(s.correct / s.answered * 100);
                }
                const label = document.createElement("div");
                label.className = "bar-label";
                label.textContent = subjects[i] + ":" + rate + "%(" + s.correct + " / " + s.answered + "問)";

                const bar = document.createElement("div");
                bar.className = "bar";
                const fill = document.createElement("div");
                fill.className = "bar-fill";
                if (rate > 60) {
                    fill.classList.add("pass");
                }
                fill.style.width = rate + "%";

                bar.appendChild(fill);
                box.appendChild(label);
                box.appendChild(bar);
            }

            const history = JSON.parse(localStorage.getItem("examHistory") || "[]");
            const historyBox = document.getElementById("stat-history");
            historyBox.innerHTML = "";
            if (history.length === 0) {
                historyBox.textContent = "まだ受験記録はありません";
            }
            for (let i = history.length -1; i >= 0; i--) {
                const h = history[i];
                const item = document.createElement("div");
                item.className = "history-item";
                item.textContent = h.date + " " + h.title + " " + h.score + "/" + h.total + (h.pass ? " 合格" : " 不合格");
                historyBox.appendChild(item);
            }
        }

        function recordAnswer(quiz, isCorrect) {
            const today = dayKey(0);
            stats.days[today] = (stats.days[today] || 0) + 1;

            if (!stats.subjects[quiz.subject]) {
                stats.subjects[quiz.subject] = { answered: 0, correct: 0 };
            }
            stats.subjects[quiz.subject].answered++;
            if (isCorrect) {
                stats.subjects[quiz.subject].correct++;
            }

            localStorage.setItem("stats", JSON.stringify(stats));
        }

        function getStreak() {
            let offset = 0;
            if (!stats.days[dayKey(0)]) {
                offset = 1;
            }
            let streak = 0;
            while (stats.days[dayKey(offset)]) {
                streak++;
                offset++;
            }
            return streak;
        }

        function showQuiz() {
            answered = false;
            const quiz = quizzes[current];
            document.getElementById("question").textContent = quiz.question;
            document.getElementById("result").textContent = "";
            document.getElementById("explanation").textContent = "";

            const choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";
            const order = [];
            for (let i = 0; i < quiz.choices.length; i++) {
                order.push(i);
            }
            if (!quiz.noShuffle) {
                shuffle(order);
            }

            for (let k = 0; k < order.length; k++) {
                const i = order[k];
                const button = document.createElement("button");
                button.textContent = quiz.choices[i];
                button.onclick = function () {
                    check(i);
                };
                choicesDiv.appendChild(button);
            }
            updateBookmarkButton();
        }
        //答え合わせ
        function check(index) {
            if (answered) return;
            answered = true;
            const quiz = quizzes[current];
            const result = document.getElementById("result");
            const explanation = document.getElementById("explanation");
            explanation.textContent = quiz.explanation;
            if (index === quiz.answer) {
                result.textContent = "正解!";
                result.style.color = "green";
                score++;
                correctBySubject[quiz.subject]++;
            } else {
                result.textContent = "不正解...正解は「" + quiz.choices[quiz.answer] + "」です";
                result.style.color = "red";
                wrongQuizzes.push(quiz);
            }
            recordAnswer(quiz, index === quiz.answer);
            updateScore();
        }
        //次の問題へ
        function next() {
            current++;
            if (current >= quizzes.length) {
                if (isExam) {
                    showExamResult();
                    return;
                }
                if (setInfo) {
                    showSetEnd();
                    return;
                }
                current = 0;
                score = 0;
                shuffle(quizzes);
            }
            showQuiz();
        }
        //モード選択から始動
        document.getElementById("set-size").value = localStorage.getItem("setSize") || "all";

        const saveDark = localStorage.getItem("dark");
        if (saveDark === "1" ||
            (saveDark === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.body.classList.add("dark");
        }
        updateDarkButton();

        backToMenu();
        function showExamIntro() {
            showScreen("exam-intro");

            const saved = localStorage.getItem("lastExam");
            const lastResult = document.getElementById("last-result");
            if (saved) {
                lastResult.innerHTML = "<h3>前回の成績</h3>" + saved;
            } else {
                lastResult.innerHTML = "<p>まだ受験記録はありません</p>";
            }
        }
        function showRuiSelect() {
            showScreen("rui-select");
        }
        function showExamResult() {
            const subjects = ["法令", "物化", "性消"];
            let text = "";
            let allPass = true;
            for (let i = 0; i < subjects.length; i++) {
                const s = subjects[i];
                const total = quizzes.filter(function (quiz) {
                    return quiz.subject === s;
                }).length;
                const correct = correctBySubject[s];
                let rate = 0;
                if (total > 0) {
                    rate = Math.floor(correct / total * 100);
                }
                const pass = correct * 10 >= total * 6;
                if (!pass) {
                    allPass = false;
                }
                text += s + ":" + correct + "/" + total + "(" + rate + "%)" + (pass ? "o" : "x") + "<br>";
            }
            const now = new Date().toLocaleString("ja-JP");
            const summary = "<p>" + now + "</p>" + text
                + "<p><b>" + (allPass ? "合格" : "不合格") + "</b></p>";
            localStorage.setItem("examKey", summary);
            const history = JSON.parse(localStorage.getItem("examHistory") || "[]");
            history.push({
                date: now,
                title: examTitle,
                score: score,
                total: quizzes.length,
                pass: allPass
            });
            while (history.length > 20) {
                history.shift();
            }
            localStorage.setItem("examHistory", JSON.stringify(history));
            text += "<h3>間違えた問題(" + wrongQuizzes.length + "問)</h3>";
            if (wrongQuizzes.length === 0) {
                text += "<p>全問正解です</p>";
            }
            for (let i = 0; i < subjects.length; i++) {
                const s = subjects[i];
                const wrongs = wrongQuizzes.filter(function (quiz) {
                    return quiz.subject === s;
                });
                if (wrongs.length === 0) {
                    continue;
                }
                text += "<details>";
                text += "<summary>" + s + "(" + wrongs.length + "問)</summary>";
                for (let j = 0; j < wrongs.length; j++) {
                    const q = wrongs[j];
                    text += "<div class='review'>"
                        + "<p>" + q.question + "</p>"
                        + "<p>正解:" + q.choices[q.answer] + "</p>"
                        + "<p>" + q.explanation + "</p>"
                        + "<div>";
                }
                text += "</details>";
            }
            document.getElementById("question").textContent = examTitle + "模擬試験 結果";
            document.getElementById("choices").innerHTML = text;
            document.getElementById("explanation").textContent = "";
            const result = document.getElementById("result");
            if (allPass) {
                result.textContent = "合格";
                result.style.color = "green";
            } else {
                result.textContent = "不合格...60%未満の科目を復習しましょう";
                result.style.color = "red";
            }
        }
        // サービスワーカーを登録する
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
</body>

</html>
